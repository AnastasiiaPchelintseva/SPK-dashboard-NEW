{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:60px auto">
  <h1>Вход администратора</h1>
  {% if admin_enabled %}
  <form method="post" action="/login/admin">
    <input type="hidden" name="csrf" value="{{ login_csrf }}">
    <p><label>Пользователь<br><input value="admin" disabled></label></p>
    <p><label>Пароль<br><input type="password" name="password" autofocus autocomplete="current-password"></label></p>
    <p><button type="submit">Войти</button></p>
  </form>
  {% else %}
    <div class="msg warn">Вход администратора выключен: не задан ADMIN_PASSWORD.</div>
  {% endif %}
  <p class="small"><a href="/login">← Назад</a></p>
</div>
{% endblock %}
